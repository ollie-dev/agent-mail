# Runs the tests on macOS and Windows for every push to main and every pull
# request, with read-only permissions.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        run: cargo test --locked

      # Installs, updates and removes agent-mail and its Broker for real;
      # GitHub's Windows runners are elevated.
      - name: Installer tests
        if: runner.os == 'Windows'
        run: cargo test --locked --test installers -- --ignored --test-threads=1
