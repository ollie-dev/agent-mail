# Builds, signs and publishes agent-mail for macOS and Windows x64 when a
# release tag is pushed, then verifies the published release from a fresh
# runner.
#
# Hand-written rather than generated by `dist`: `dist` signs macOS binaries
# only with a Developer ID certificate and cannot apply an ad-hoc signature
# with the hardened runtime (`--options runtime`), which agent-mail needs
# before it will touch the Keychain (ADR-0002). Signing, checksums and
# attestation are kept visible in this one file.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Runs the tests on macOS and Windows with read-only permissions, so test
  # and dev-dependency code never sees the publish job's write scopes or
  # OIDC token. A failure on either OS blocks publish.
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      # Installs, updates and removes agent-mail and its Broker for real;
      # GitHub's Windows runners are elevated.
      - name: Installer tests
        if: runner.os == 'Windows'
        run: cargo test --locked --test installers -- --ignored --test-threads=1

  # Builds the Windows x64 binary with read-only permissions and hands it to
  # publish as a workflow artifact. Not code-signed.
  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage, dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/agent-mail.exe stage/agent-mail.exe
          Compress-Archive -Path stage/agent-mail.exe -DestinationPath dist/agent-mail-x86_64-pc-windows-msvc.zip

      - name: Checksum
        shell: bash
        run: |
          asset=agent-mail-x86_64-pc-windows-msvc.zip
          cd dist
          # shasum -a 256 format: digest, two spaces, asset name, LF.
          sum=$(sha256sum "$asset" | cut -c 1-64)
          printf '%s  %s\n' "$sum" "$asset" > "$asset.sha256"
          grep -Eqx "[0-9a-f]{64}  $asset" "$asset.sha256"
          cat "$asset.sha256"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/agent-mail-x86_64-pc-windows-msvc.zip
            dist/agent-mail-x86_64-pc-windows-msvc.zip.sha256
          if-no-files-found: error

  publish:
    needs: [test, build-windows]
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Sign, package and checksum
        run: |
          mkdir dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            stage="stage/$target"
            mkdir -p "$stage"
            cp "target/$target/release/agent-mail" "$stage/agent-mail"
            scripts/sign-macos.sh "$stage/agent-mail"
            asset="agent-mail-$target.tar.gz"
            tar -czf "dist/$asset" -C "$stage" agent-mail
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
            cat "dist/$asset.sha256"
          done
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          cp uninstall.ps1 dist/uninstall.ps1

      - name: Download the Windows build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/agent-mail-aarch64-apple-darwin.tar.gz
            dist/agent-mail-x86_64-apple-darwin.tar.gz
            dist/agent-mail-x86_64-pc-windows-msvc.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "agent-mail $TAG" \
            --notes-file .github/release-notes.md \
            dist/agent-mail-aarch64-apple-darwin.tar.gz \
            dist/agent-mail-aarch64-apple-darwin.tar.gz.sha256 \
            dist/agent-mail-x86_64-apple-darwin.tar.gz \
            dist/agent-mail-x86_64-apple-darwin.tar.gz.sha256 \
            dist/agent-mail-x86_64-pc-windows-msvc.zip \
            dist/agent-mail-x86_64-pc-windows-msvc.zip.sha256 \
            dist/install.sh \
            dist/install.ps1 \
            dist/uninstall.ps1

  verify:
    needs: publish
    runs-on: macos-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/verify-release.sh "$TAG"
