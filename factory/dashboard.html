<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6f6f6a; --line: #e4e3df;
    --pass: #1f8a4c; --pass-bg: #e3f4ea; --changes: #b25e00; --changes-bg: #fdf0dc;
    --pending: #9a9a94; --pending-bg: #efefec; --human: #c2362b; --human-bg: #fdeceb;
    --accent: #3a5bd9; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9b9a94; --line: #2e2e2b;
      --pass: #5cc98a; --pass-bg: #173323; --changes: #f0a54a; --changes-bg: #3a2a12;
      --pending: #807f79; --pending-bg: #2a2a27; --human: #ff7a6e; --human-bg: #3d1d1a;
      --accent: #8aa2ff; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px 8px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); }
  .live.off .dot { background: var(--human); }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }
  code, .mono { font-family: var(--mono); font-size: 12px; }

  /* backlog */
  #backlog { margin: 10px 24px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
             box-shadow: var(--shadow); }
  #backlog[hidden] { display: none; }
  #backlog summary { cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: 13px; display: flex;
                     align-items: baseline; gap: 8px; list-style: none; }
  #backlog summary::-webkit-details-marker { display: none; }
  #backlog summary::before { content: '▸'; color: var(--muted); transition: transform .15s; display: inline-block; }
  #backlog[open] summary::before { transform: rotate(90deg); }
  #backlog summary .n { color: var(--muted); font-weight: 400; font-size: 12px; }
  #backlog .peek { font-weight: 400; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #backlog summary .cmd { margin: 0 0 0 auto; flex-shrink: 0; font-weight: 400; }
  #backlog .peek:empty, #backlog[open] .peek { display: none; }
  #backlog ol { margin: 0; padding: 0 14px 10px 36px; display: flex; flex-direction: column; gap: 3px; }
  #backlog li { color: var(--ink); }
  #backlog li .path { color: var(--muted); margin-left: 6px; overflow-wrap: anywhere; }
  #backlog li.next .text { font-weight: 600; }
  #backlog li[data-issue] { cursor: pointer; border-radius: 5px; margin: 0 -6px; padding: 1px 6px; }
  #backlog li[data-issue]:hover .text { color: var(--accent); }
  #backlog li.active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tag { font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; margin-left: 6px;
         background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }

  /* needs-human strip */
  #human { margin: 10px 24px 0; }
  #human:empty { display: none; }
  .human-head { color: var(--human); font-weight: 600; font-size: 12px; text-transform: uppercase;
                letter-spacing: .06em; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .human-head .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--human);
                       animation: pulse 1.6s ease-in-out infinite; }
  .human-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .card.needs { border-color: var(--human); background: var(--human-bg); }
  .reason { margin: 6px 0 8px; }
  .cmd { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 3px 7px; margin-top: 4px; color: var(--ink); cursor: copy; width: fit-content; max-width: 100%;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* board */
  #board { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 12px;
           padding: 16px 24px 32px; overflow-x: auto; }
  .col { min-width: 0; }
  .col-head { display: flex; align-items: baseline; gap: 6px; padding: 0 2px 8px; font-weight: 600; font-size: 13px; }
  .col-head .who { color: var(--muted); font-weight: 400; font-size: 11px; }
  .col-head .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
  .col-body { display: flex; flex-direction: column; gap: 8px; min-height: 120px; padding: 8px;
              border-radius: 10px; background: color-mix(in srgb, var(--line) 45%, transparent); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 0; }

  .card { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
          box-shadow: var(--shadow); cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); }
  .card.active { outline: 2px solid var(--accent); outline-offset: -1px; }
  .card .id { color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 4px; }
  .card .meta { display: flex; gap: 8px; color: var(--muted); font-size: 11px; flex-wrap: wrap; }
  .card.merged { opacity: .72; }

  .rounds { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { width: 22px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  .round.old { opacity: .55; }
  .chip { font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 999px; letter-spacing: .02em;
          background: var(--pending-bg); color: var(--pending); border: 1px solid transparent; }
  .chip.PASS { background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { background: var(--changes-bg); color: var(--changes); }
  .chip.VERIFIED { background: var(--pass-bg); color: var(--pass); }
  .chip.NOT-FIXED { background: var(--human-bg); color: var(--human); }
  .round.nit .r { color: var(--accent); }
  .chip.pending { border-style: dashed; border-color: var(--pending); animation: pulse 1.6s ease-in-out infinite; }
  .chip:hover { filter: brightness(.95); }
  @keyframes pulse { 50% { opacity: .45; } }

  /* drawer */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--panel);
            border-left: 1px solid var(--line); visibility: hidden;
            transform: translateX(100%); transition: transform .2s ease, visibility .2s; display: flex; flex-direction: column; z-index: 5; }
  #drawer.open { transform: none; visibility: visible; box-shadow: -8px 0 24px rgba(0,0,0,.08); }
  .d-head { padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
  .d-head .x { float: right; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; line-height: 1; }
  .d-head h2 { font-size: 16px; margin: 2px 0 6px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 10px; align-items: center; }
  .tabs .grp { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .tab { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 6px; padding: 3px 8px;
         font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .tab.missing { color: var(--pending); border-style: dashed; }
  .tab .v { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); }
  .tab .v.PASS, .tab .v.APPROVE, .tab .v.VERIFIED { background: var(--pass); }
  .tab .v.CHANGES { background: var(--changes); }
  .tab .v.ESCALATE, .tab .v.NOT-FIXED { background: var(--human); }
  .d-body { padding: 18px 22px 40px; overflow: auto; flex: 1; }

  .md h1 { font-size: 19px; } .md h2 { font-size: 15px; margin-top: 22px; } .md h3 { font-size: 14px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; overflow-x: auto; }
  .md code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md a { color: var(--accent); }
  .verdict { display: inline-block; font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 4px 10px;
             border-radius: 999px; margin-bottom: 4px; }
  .verdict.PASS, .verdict.APPROVE, .verdict.VERIFIED { background: var(--pass-bg); color: var(--pass); }
  .verdict.CHANGES { background: var(--changes-bg); color: var(--changes); }
  .verdict.ESCALATE, .verdict.NOT-FIXED { background: var(--human-bg); color: var(--human); }
  .notyet { color: var(--muted); }

  @media (max-width: 700px) {
    #backlog { margin-left: 16px; margin-right: 16px; }
    header, #human { padding-left: 16px; padding-right: 16px; margin-left: 0; margin-right: 0; }
    #board { padding: 12px 16px 24px; grid-template-columns: repeat(6, 78vw); }
  }
</style>
</head>
<body>
<header>
  <h1>Factory</h1>
  <span class="live" id="live"><span class="dot"></span><span id="liveText">connecting…</span></span>
  <span class="spacer"></span>
  <span class="hint">Start a job: <code>/factory &lt;feature&gt;</code> or <code>/factory next</code></span>
</header>
<details id="backlog" hidden><summary>Backlog <span class="n" id="backlogN"></span><span class="peek" id="backlogPeek"></span><code class="cmd" title="Click to copy">/factory next</code></summary><ol id="backlogList"></ol></details>
<section id="human"></section>
<main id="board"></main>
<aside id="drawer" aria-hidden="true"></aside>

<script>
const STAGES = [
  ['spec', 'Spec', 'spec-writer'],
  ['build', 'Build', 'builder'],
  ['review', 'Review', '4 reviewers'],
  ['nit', 'Nit pass', 'builder + verify'],
  ['approval', 'Approver', 'approver'],
  ['merged', 'Merged', 'main'],
];
const REVIEWERS = [['security', 'SEC'], ['ux', 'UX'], ['ui', 'UI'], ['code', 'CODE']];
const LABEL = Object.fromEntries(REVIEWERS);
const POLL_MS = 2000;

let board = { jobs: [] };
let lastBoard = '';
let lastBacklog = null;
let open = null; // { id, path } for a job, { issue, text } for a backlog item
const exists = {}; // "jobId/path" -> true | false

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function roundsOf(job) {
  const rounds = [...(job.history || [])];
  if (job.reviews && job.round) rounds.push(job.reviews);
  return rounds;
}

function chipsHtml(job) {
  const rounds = roundsOf(job);
  if (!rounds.length) return '';
  return '<div class="rounds">' + rounds.map((r, i) => {
    const n = i + 1;
    return `<div class="round ${n < rounds.length ? 'old' : ''}"><span class="r">R${n}</span>` +
      REVIEWERS.map(([key, label]) => {
        const v = r[key] || 'pending';
        return `<span class="chip ${esc(v)}" title="${key}: ${esc(v)}" data-job="${esc(job.id)}" data-path="round-${n}/review-${key}.md">${label}</span>`;
      }).join('') + '</div>';
  }).join('') + nitsHtml(job) + '</div>';
}

// one row per nit pass: the reviewers that raised [fix-now] findings and their verify verdicts
function nitsHtml(job) {
  return (job.nits || []).map(n =>
    `<div class="round nit" title="nit pass ${n.attempt} for round ${n.round}${n.commit ? ' · ' + esc(n.commit) : ''}"><span class="r">N${n.attempt}</span>` +
    Object.entries(n.verify || {}).map(([key, v]) =>
      `<span class="chip ${esc(v)}" title="${esc(key)} verify: ${esc(v)}" data-job="${esc(job.id)}" data-path="round-${n.round}/verify-${esc(key)}-${n.attempt}.md">${esc(LABEL[key] || key)}</span>`
    ).join('') + '</div>').join('');
}

function cardHtml(job) {
  const needs = job.stage === 'needs-human';
  const active = open && open.id === job.id ? ' active' : '';
  let extra = '';
  if (needs) {
    extra = `<div class="reason">${esc(job.reason || 'Waiting for a human decision.')}</div>` +
      `<code class="cmd" title="Click to copy">/factory approve ${esc(job.id)}</code>` +
      `<code class="cmd" title="Click to copy">/factory rework ${esc(job.id)} "…"</code>`;
  }
  return `<div class="card ${needs ? 'needs' : ''} ${job.stage === 'merged' ? 'merged' : ''}${active}" data-job="${esc(job.id)}">
    <div class="id mono">${esc(job.id)}</div>
    <div class="title">${esc(job.title || job.feature || job.id)}</div>
    <div class="meta"><span class="mono">${esc(job.branch || '')}</span>${job.round ? `<span>round ${job.round}</span>` : ''}<span>${ago(job.updated)}</span></div>
    ${extra}${chipsHtml(job)}
  </div>`;
}

function render() {
  const jobs = [...(board.jobs || [])].sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
  const human = jobs.filter(j => j.stage === 'needs-human');
  document.getElementById('human').innerHTML = human.length
    ? `<div class="human-head"><span class="pulse"></span>Needs you · ${human.length}</div><div class="human-row">${human.map(cardHtml).join('')}</div>`
    : '';
  document.getElementById('board').innerHTML = STAGES.map(([key, label, who]) => {
    const inCol = jobs.filter(j => j.stage === key);
    return `<section class="col"><div class="col-head">${label} <span class="who">${who}</span><span class="n">${inCol.length || ''}</span></div>
      <div class="col-body">${inCol.length ? inCol.map(cardHtml).join('') : '<div class="empty">—</div>'}</div></section>`;
  }).join('');
  document.title = human.length ? `(${human.length}) Factory` : 'Factory';
}

// ---------- drawer ----------
function filesOf(job) {
  const files = [{ group: '', label: 'Spec', path: 'spec.md' }, { group: '', label: 'Build', path: 'build.md' }];
  roundsOf(job).forEach((r, i) => REVIEWERS.forEach(([key, label]) =>
    files.push({ group: `R${i + 1}`, label, path: `round-${i + 1}/review-${key}.md`, verdict: r[key] || 'pending' })));
  (job.nits || []).forEach(n => Object.entries(n.verify || {}).forEach(([key, v]) =>
    files.push({ group: `N${n.attempt}`, label: LABEL[key] || key, path: `round-${n.round}/verify-${key}-${n.attempt}.md`, verdict: v })));
  files.push({ group: '', label: 'Decision', path: 'decision.md', verdict: decisionOf(job) });
  files.push({ group: '', label: 'Human notes', path: 'human-notes.md' });
  return files;
}

function decisionOf(job) {
  if (job.stage === 'merged') return 'APPROVE';
  if (job.stage === 'needs-human') return 'ESCALATE';
  return 'pending';
}

async function probe(job) {
  await Promise.all(filesOf(job).map(async f => {
    const k = job.id + '/' + f.path;
    if (exists[k]) return;
    try { exists[k] = (await fetch(`jobs/${job.id}/${f.path}`, { method: 'HEAD', cache: 'no-store' })).ok; }
    catch { exists[k] = false; }
  }));
}

// backlog paths are relative to the repo root; factory/scratch links to ../.scratch
const issueUrl = path => path.startsWith('.scratch/') ? 'scratch/' + path.slice('.scratch/'.length) : null;

async function renderIssueDrawer() {
  const el = document.getElementById('drawer');
  const url = issueUrl(open.issue);
  let body;
  try {
    const r = url && await fetch(url, { cache: 'no-store' });
    body = r && r.ok ? markdown(await r.text()) : `<p class="notyet">Could not load <code>${esc(open.issue)}</code>.</p>`;
  } catch { body = '<p class="notyet">Could not load file.</p>'; }
  const scroll = el.querySelector('.d-body')?.scrollTop || 0;
  el.innerHTML = `<div class="d-head"><button class="x" title="Close (Esc)">×</button>
      <div class="mono id">backlog · ${esc(open.issue)}</div>
      <h2>${inline(open.text)}</h2></div>
    <div class="d-body md">${body}</div>`;
  el.querySelector('.d-body').scrollTop = scroll;
  el.classList.add('open');
  el.setAttribute('aria-hidden', 'false');
}

function openIssue(issue, text) {
  if (!open || open.issue !== issue) document.getElementById('drawer').innerHTML = '';
  open = { issue, text };
  render();
  if (lastBacklog !== null) renderBacklog(lastBacklog);
  renderIssueDrawer();
}

async function renderDrawer() {
  if (open.issue) return renderIssueDrawer();
  const job = (board.jobs || []).find(j => j.id === open.id);
  const el = document.getElementById('drawer');
  if (!job) { closeDrawer(); return; }
  await probe(job);
  let tabs = '', lastGroup = null;
  for (const f of filesOf(job)) {
    if (f.group !== lastGroup && f.group) tabs += `<span class="grp">${f.group}</span>`;
    lastGroup = f.group;
    const missing = !exists[job.id + '/' + f.path];
    if (missing && (f.path === 'human-notes.md')) continue;
    tabs += `<button class="tab ${open.path === f.path ? 'on' : ''} ${missing ? 'missing' : ''}" data-path="${f.path}">` +
      (f.verdict ? `<span class="v ${esc(f.verdict)}"></span>` : '') + `${f.label}</button>`;
  }
  let body;
  try {
    const r = await fetch(`jobs/${job.id}/${open.path}`, { cache: 'no-store' });
    body = r.ok ? markdown(await r.text()) : `<p class="notyet">Not written yet: <code>${esc(open.path)}</code></p>`;
  } catch { body = '<p class="notyet">Could not load file.</p>'; }
  const scroll = el.querySelector('.d-body')?.scrollTop || 0;
  el.innerHTML = `<div class="d-head"><button class="x" title="Close (Esc)">×</button>
      <div class="mono id">${esc(job.id)} · ${esc(job.stage)}${job.round ? ' · round ' + job.round : ''}</div>
      <h2>${esc(job.title || job.id)}</h2>
      <div class="hint">${esc(job.feature || '')}</div>
      <div class="tabs">${tabs}</div></div>
    <div class="d-body md">${body}</div>`;
  el.querySelector('.d-body').scrollTop = scroll;
  el.classList.add('open');
  el.setAttribute('aria-hidden', 'false');
}

function openFile(id, path) {
  const changedJob = !open || open.id !== id;
  open = { id, path: path || 'spec.md' };
  if (changedJob) document.getElementById('drawer').innerHTML = '';
  render();
  if (lastBacklog !== null) renderBacklog(lastBacklog);
  renderDrawer();
}
function closeDrawer() {
  open = null;
  const el = document.getElementById('drawer');
  el.classList.remove('open');
  el.setAttribute('aria-hidden', 'true');
  render();
  if (lastBacklog !== null) renderBacklog(lastBacklog);
}

// ---------- tiny markdown ----------
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  const first = (lines[0] || '').trim();
  const m = first.match(/^(?:VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE|VERIFIED|NOT-FIXED)$/);
  if (m) { out.push(`<div class="verdict ${m[1]}">${esc(first)}</div>`); i = 1; }
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    let h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^\|/.test(line) && /^\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      const cells = l => l.replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      let t = '<table><thead><tr>' + cells(line).map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) t += '<tr>' + cells(lines[i++]).map(c => `<td>${c}</td>`).join('') + '</tr>';
      out.push(t + '</tbody></table>'); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let t = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, '');
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) t += ' ' + lines[i++].trim();
        const box = t.match(/^\[( |x)\]\s+(.*)/i);
        items.push(box ? `<li>${box[1] === ' ' ? '☐' : '☑'} ${inline(box[2])}</li>` : `<li>${inline(t)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`); continue;
    }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s|>|\|)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(' '))}</p>`);
  }
  return out.join('\n');
}

// ---------- backlog ----------
function renderBacklog(src) {
  const items = src.replace(/\r/g, '').split('\n').map(l => l.match(/^\s*[-*]\s+\[ \]\s+(.*)$/)).filter(Boolean).map(m => {
    const p = m[1].match(/^(.*?)\s*\(([^()\s]+\.md)\)\s*$/);
    return p ? { text: p[1], path: p[2] } : { text: m[1], path: '' };
  });
  const el = document.getElementById('backlog');
  el.hidden = false;
  document.getElementById('backlogN').textContent = items.length ? `${items.length} open` : 'empty';
  document.getElementById('backlogPeek').innerHTML = items.length
    ? `<span class="tag" title="/factory next picks this one">next</span> ${inline(items[0].text)}` : '';
  document.getElementById('backlogList').innerHTML = items.map((it, i) =>
    `<li class="${i ? '' : 'next'}${open && open.issue === it.path && it.path ? ' active' : ''}"` +
    (it.path ? ` data-issue="${esc(it.path)}" data-text="${esc(it.text)}"` : '') + `><span class="text">${inline(it.text)}</span>` +
    (i ? '' : '<span class="tag" title="/factory next picks this one">next</span>') +
    (it.path ? `<span class="path mono">${esc(it.path)}</span>` : '') + '</li>').join('');
}
async function pollBacklog() {
  try {
    const r = await fetch('backlog.md', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const raw = await r.text();
    if (raw !== lastBacklog) { lastBacklog = raw; renderBacklog(raw); }
  } catch { document.getElementById('backlog').hidden = true; lastBacklog = null; }
}
(() => {
  const el = document.getElementById('backlog');
  try { el.open = localStorage.getItem('factory.backlogOpen') === '1'; } catch {}
  el.addEventListener('toggle', () => { try { localStorage.setItem('factory.backlogOpen', el.open ? '1' : '0'); } catch {} });
})();

// ---------- events + polling ----------
document.addEventListener('click', e => {
  const cmd = e.target.closest('.cmd');
  if (cmd) { e.stopPropagation(); e.preventDefault(); navigator.clipboard?.writeText(cmd.textContent); cmd.style.borderColor = 'var(--pass)'; return; }
  const chip = e.target.closest('.chip');
  if (chip) { e.stopPropagation(); openFile(chip.dataset.job, chip.dataset.path); return; }
  const issue = e.target.closest('[data-issue]');
  if (issue) { openIssue(issue.dataset.issue, issue.dataset.text); return; }
  const card = e.target.closest('.card');
  if (card) { openFile(card.dataset.job); return; }
  const tab = e.target.closest('.tab');
  if (tab) { open.path = tab.dataset.path; renderDrawer(); return; }
  if (e.target.closest('.x')) closeDrawer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) closeDrawer(); });

async function poll() {
  pollBacklog();
  const live = document.getElementById('live'), text = document.getElementById('liveText');
  try {
    const r = await fetch('board.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const raw = await r.text();
    live.classList.remove('off');
    text.textContent = `live · ${(JSON.parse(raw).jobs || []).length} jobs`;
    if (raw !== lastBoard) {
      lastBoard = raw; board = JSON.parse(raw);
      for (const k in exists) if (!exists[k]) delete exists[k]; // re-probe files that were missing
      render();
    }
    if (open) renderDrawer();
  } catch {
    live.classList.add('off');
    text.textContent = 'board.json unreachable: run python3 -m http.server in factory/';
  }
}
render();
poll();
setInterval(poll, POLL_MS);
</script>
