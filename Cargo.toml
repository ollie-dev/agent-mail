[package]
name = "agent-mail"
version = "0.1.0"
edition = "2024"
description = "Lets AI agents work with email while keeping mail credentials out of their hands"
publish = false

[features]
default = []
# Compiles test-only code: the in-memory store and the extra-trust-roots hook
# for the fake IMAP server. Never enabled in a release build.
test-support = []

[dependencies]
async-channel = "2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
inquire = "0.9.4"
# Compile out all log calls: async-imap traces raw commands, including LOGIN.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
mail-parser = "0.11"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
# raw_value: Broker replies carry the CLI's JSON byte for byte.
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.8"
# Built-in roots for proxy mode, where the system verifier is unavailable.
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
agent-mail = { path = ".", features = ["test-support"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# getpwuid_r: the audit log's home directory comes from the user database.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"

[target.'cfg(windows)'.dependencies]
# Credential Manager (CredReadW, CredWriteW, CredDeleteW, CredEnumerateW) for
# the Mandate store, the Local AppData and ProgramData known folders for the
# audit logs, WriteConsoleW for the console messages of `mandate create`,
# and for the Broker the service control manager, the named pipe,
# impersonation, tokens, access lists and overlapped I/O; for the Broker
# clients the elevation check and the owner and server process of the pipe.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
# The hardened-runtime self-check is skipped when debug assertions are on:
# keep them off in every release build.
debug-assertions = false
